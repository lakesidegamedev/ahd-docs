<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="How the exchange matches a buyer need to offers">
<title>How the exchange matches a buyer need to offers</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="359" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="105" y="41.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Buyer need</text><text x="105" y="56.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">any region, one good</text>
<rect x="225" y="20" width="210" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="330" y="41.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Collect offers</text><text x="330" y="56.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">ask + freight, cheapest route</text>
<rect x="235" y="110" width="190" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="330" y="131.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Gateway import offer</text><text x="330" y="146.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">buyer's own region, no freight</text>
<rect x="235" y="200" width="190" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="330" y="221.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Sort by delivered price</text><text x="330" y="236.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">lowest first</text>
<rect x="20" y="200" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="105" y="221.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Fill cheapest first</text><text x="105" y="236.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">tied buyers share pro rata</text>
<rect x="20" y="290" width="170" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="105" y="311.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Leftover need</text><text x="105" y="326.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">becomes a shortage</text>
<rect x="450" y="290" width="170" height="50" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="535" y="311.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Prices react</text><text x="535" y="326.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">shortage pushes asks up</text>
<line x1="190" y1="45" x2="225" y2="45" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="330" y1="70" x2="330" y2="110" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="330" y1="160" x2="330" y2="200" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="235" y1="225" x2="190" y2="225" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="105" y1="250" x2="105" y2="290" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="190" y1="315" x2="450" y2="315" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<text x="440" y="140" font-size="11"  text-anchor="start" fill="#dc2626">Marked at 115% of world price:</text>
<text x="440" y="155" font-size="11"  text-anchor="start" fill="#dc2626">the last resort, used only when</text>
<text x="440" y="170" font-size="11"  text-anchor="start" fill="#dc2626">no seller can fill the need.</text>
</svg>

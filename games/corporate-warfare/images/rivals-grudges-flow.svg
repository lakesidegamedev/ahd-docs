<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="How grudges and alliances form and fade">
<title>How grudges and alliances form and fade</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="399" fill="#ffffff" stroke="#d4d4d8"/>
<text x="20" y="22" font-size="12" font-weight="600" text-anchor="start" fill="#dc2626">Feeds a grudge</text>
<rect x="20" y="34" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="85" y="58" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Raid</text>
<line x1="150" y1="54" x2="215" y2="128" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="20" y="86" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="85" y="110" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Failed raid</text>
<line x1="150" y1="106" x2="215" y2="128" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="20" y="138" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="85" y="162" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Hostile bid</text>
<line x1="150" y1="158" x2="215" y2="128" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="20" y="190" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="85" y="214" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Lane lockout</text>
<line x1="150" y1="210" x2="215" y2="128" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="215" y="100" width="150" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="290" y="124.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Grudge</text><text x="290" y="139.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">fades about 1% a week</text>
<text x="620" y="22" font-size="12" font-weight="600" text-anchor="end" fill="#27272a">Feeds an alliance</text>
<rect x="490" y="34" width="130" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="555" y="58" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Joint venture</text>
<line x1="490" y1="54" x2="435" y2="205" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="490" y="86" width="130" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="555" y="110" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Friendly deal</text>
<line x1="490" y1="106" x2="435" y2="205" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="285" y="184" width="150" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="360" y="208.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Alliance</text><text x="360" y="223.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">fades about 0.6% a week</text>
<line x1="360" y1="184" x2="300" y2="156" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<text x="255" y="185" font-size="11"  text-anchor="end" fill="#52525b">alliance halves grudges</text>
<rect x="20" y="300" width="600" height="60" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="320" y="334" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Rival AI: spares a firm when the alliance reaches 5,000 or more</text>
<line x1="360" y1="240" x2="360" y2="300" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<text x="20" y="385" font-size="11"  text-anchor="start" fill="#52525b">Both scores drop away once they fall below 150 and are forgotten.</text>
</svg>

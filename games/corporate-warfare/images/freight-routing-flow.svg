<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="How a shipment is routed and which carrier takes it">
<title>How a shipment is routed and which carrier takes it</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="379" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="110" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="75" y="39.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Need</text><text x="75" y="54.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">goods to move</text>
<rect x="160" y="20" width="240" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="280" y="39.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Shipping policy</text><text x="280" y="54.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">cheapest, fastest, own first, reliable</text>
<rect x="430" y="20" width="190" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="525" y="39.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Route</text><text x="525" y="54.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">up to 3 legs, mode per leg</text>
<text x="525" y="84" font-size="11"  text-anchor="middle" fill="#52525b">+1 week at each change of mode</text>
<line x1="130" y1="43" x2="160" y2="43" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="400" y1="43" x2="430" y2="43" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<text x="20" y="128" font-size="12" font-weight="600" text-anchor="start" fill="#27272a">Capacity is offered in this order, at this rate (% of base):</text>
<rect x="20" y="145" width="330" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="185" y="169" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">1  Own carrier</text>
<text x="400" y="170" font-size="12" font-weight="600" text-anchor="start" fill="#2563eb">65%</text>
<line x1="185" y1="185" x2="185" y2="199" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/><text x="193" y="195" font-size="11" text-anchor="start" fill="#52525b">if full, next</text>
<rect x="28" y="199" width="330" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="193" y="223" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">2  Contracted lots</text>
<text x="400" y="224" font-size="12" font-weight="600" text-anchor="start" fill="#2563eb">90%</text>
<line x1="185" y1="239" x2="185" y2="253" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/><text x="193" y="249" font-size="11" text-anchor="start" fill="#52525b">if full, next</text>
<rect x="36" y="253" width="330" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="201" y="277" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">3  Other owners on the lane</text>
<text x="400" y="278" font-size="12" font-weight="600" text-anchor="start" fill="#2563eb">rises with fill</text>
<line x1="185" y1="293" x2="185" y2="307" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/><text x="193" y="303" font-size="11" text-anchor="start" fill="#52525b">if full, next</text>
<rect x="44" y="307" width="330" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="209" y="331" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">4  Outside carriers</text>
<text x="400" y="332" font-size="12" font-weight="600" text-anchor="start" fill="#dc2626">125%</text>
<text x="20" y="375" font-size="11"  text-anchor="start" fill="#52525b">Pipelines and ships need a terminal or infrastructure; trucks and rail reach limited distances.</text>
</svg>

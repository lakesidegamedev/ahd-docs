<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="How the business cycle, central bank, elections and laws feed each other">
<title>How the business cycle, central bank, elections and laws feed each other</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="419" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="20" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="105" y="41.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Business cycle</text><text x="105" y="56.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">boom, bust, credit</text>
<rect x="235" y="20" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="320" y="41.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Central bank</text><text x="320" y="56.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">meets every 6 weeks</text>
<rect x="450" y="20" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="535" y="41.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Rates</text><text x="535" y="56.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">policy, prime, ten-year</text>
<line x1="190" y1="45" x2="235" y2="45" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="405" y1="45" x2="450" y2="45" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="20" y="130" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="105" y="151.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Approval</text><text x="105" y="166.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">how voters feel</text>
<rect x="235" y="130" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="320" y="151.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Election</text><text x="320" y="166.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">every 208 weeks</text>
<rect x="450" y="130" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="535" y="151.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">New programme</text><text x="535" y="166.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">13 weeks later</text>
<line x1="190" y1="155" x2="235" y2="155" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="405" y1="155" x2="450" y2="155" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="105" y1="70" x2="105" y2="130" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/><text x="111" y="104" font-size="11" text-anchor="start" fill="#52525b">moves approval</text>
<text x="20" y="225" font-size="12" font-weight="600" text-anchor="start" fill="#27272a">Laws in force then feed these systems:</text>
<rect x="20" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="60" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Tax</text>
<rect x="108" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="148" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Wage floor</text>
<rect x="196" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="236" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Mergers</text>
<rect x="284" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="324" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Freight</text>
<rect x="372" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="412" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Quotas</text>
<rect x="460" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="500" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Reserve</text>
<rect x="548" y="240" width="80" height="40" rx="6" fill="#fafafa" stroke="#52525b" stroke-width="1.5" /><text x="588" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">Rescue</text>
<line x1="535" y1="180" x2="330" y2="240" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<text x="20" y="330" font-size="11"  text-anchor="start" fill="#52525b">Tax and the wage floor change costs. Merger review limits takeovers.</text>
<text x="20" y="346" font-size="11"  text-anchor="start" fill="#52525b">Freight rules cap carrier rates. Quotas limit production. The reserve and rescue</text>
<text x="20" y="362" font-size="11"  text-anchor="start" fill="#52525b">steady prices and failing firms. The cycle feeds back into approval at the next vote.</text>
</svg>

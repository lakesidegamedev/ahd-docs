<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Which markets clear inside a region and which across the whole state">
<title>Which markets clear inside a region and which across the whole state</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="359" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="20" y="30" width="280" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="160" y="109" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a"></text>
<text x="36" y="54" font-size="12" font-weight="600" text-anchor="start" fill="#27272a">Inside one region</text>
<text x="36" y="82" font-size="12"  text-anchor="start" fill="#27272a">Goods</text>
<text x="36" y="102" font-size="12"  text-anchor="start" fill="#27272a">Retail</text>
<text x="36" y="122" font-size="12"  text-anchor="start" fill="#27272a">Leases</text>
<text x="36" y="142" font-size="12"  text-anchor="start" fill="#27272a">Electricity</text>
<text x="36" y="168" font-size="11"  text-anchor="start" fill="#52525b">Goods reach other regions by freight</text>
<rect x="340" y="30" width="280" height="150" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="480" y="109" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a"></text>
<text x="356" y="54" font-size="12" font-weight="600" text-anchor="start" fill="#27272a">Across the whole state</text>
<text x="356" y="82" font-size="12"  text-anchor="start" fill="#27272a">Services</text>
<text x="356" y="102" font-size="11"  text-anchor="start" fill="#52525b">Any region in the state can serve a buyer</text>
<text x="20" y="215" font-size="12" font-weight="600" text-anchor="start" fill="#27272a">Input premium: how much extra a buyer pays by where the input comes from</text>
<rect x="20" y="230" width="190" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="115" y="256.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Home region</text><text x="115" y="271.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">100%</text>
<rect x="225" y="230" width="190" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="320" y="256.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Other region, same state</text><text x="320" y="271.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">102.5%</text>
<rect x="430" y="230" width="190" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="525" y="256.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#27272a">Other state</text><text x="525" y="271.5" font-size="12" font-weight="400" text-anchor="middle" fill="#27272a">105%</text>
<line x1="210" y1="260" x2="225" y2="260" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
<line x1="415" y1="260" x2="430" y2="260" stroke="#52525b" stroke-width="1.5"  marker-end="url(#a)"/>
</svg>

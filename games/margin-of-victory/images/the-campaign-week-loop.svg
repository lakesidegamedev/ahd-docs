<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The weekly loop">
<title>The weekly loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="329" fill="#ffffff" stroke="#d4d4d8"/>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#27272a">The weekly loop</text>
<rect x="30" y="80" width="130" height="86" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="95" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">1  Your plan</text><text x="95" y="127" text-anchor="middle" font-size="11" fill="#52525b">Queue up to 3</text><text x="95" y="143" text-anchor="middle" font-size="11" fill="#52525b">actions a day</text><line x1="160" y1="123" x2="180" y2="123" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="80" width="130" height="86" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="245" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">2  The opponent</text><text x="245" y="127" text-anchor="middle" font-size="11" fill="#52525b">AI acts by</text><text x="245" y="143" text-anchor="middle" font-size="11" fill="#52525b">difficulty</text><line x1="310" y1="123" x2="330" y2="123" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="80" width="130" height="86" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="395" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">3  Events</text><text x="395" y="127" text-anchor="middle" font-size="11" fill="#52525b">Scheduled</text><text x="395" y="143" text-anchor="middle" font-size="11" fill="#52525b">and random</text><line x1="460" y1="123" x2="480" y2="123" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="80" width="130" height="86" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="545" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">4  Resolution</text><text x="545" y="127" text-anchor="middle" font-size="11" fill="#52525b">Actions in day order,</text><text x="545" y="143" text-anchor="middle" font-size="11" fill="#52525b">then decay and refill</text><path d="M 545 166 L 545 215 L 95 215 L 95 172" fill="none" stroke="#52525b" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="320" y="208" text-anchor="middle" font-size="12" fill="#52525b">Next week, until Election Day</text><rect x="230" y="250" width="180" height="50" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="320" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Result</text><text x="320" y="287" text-anchor="middle" font-size="11" fill="#52525b">Counted after the last week</text><line x1="545" y1="215" x2="410" y2="270" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="95" y="68" text-anchor="middle" font-size="11" fill="#52525b">Week 1 has no events</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" height="358" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The eight voter blocs">
<title>The eight voter blocs</title>
<rect x="0.5" y="0.5" width="639" height="357" fill="#ffffff" stroke="#d4d4d8"/>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#27272a">The eight voter blocs</text>
<line x1="210" x2="210" y1="60" y2="306" stroke="#e4e4e7"/><text x="210" y="322" text-anchor="middle" font-size="12" fill="#52525b">0%</text><line x1="288" x2="288" y1="60" y2="306" stroke="#e4e4e7"/><text x="288" y="322" text-anchor="middle" font-size="12" fill="#52525b">20%</text><line x1="366" x2="366" y1="60" y2="306" stroke="#e4e4e7"/><text x="366" y="322" text-anchor="middle" font-size="12" fill="#52525b">40%</text><line x1="444" x2="444" y1="60" y2="306" stroke="#e4e4e7"/><text x="444" y="322" text-anchor="middle" font-size="12" fill="#52525b">60%</text><line x1="522" x2="522" y1="60" y2="306" stroke="#e4e4e7"/><text x="522" y="322" text-anchor="middle" font-size="12" fill="#52525b">80%</text><text x="202" y="84" text-anchor="end" font-size="12" fill="#27272a">Working-class white voters</text><rect x="210" y="68" width="117" height="12" fill="#2563eb"/><text x="331" y="78" font-size="11" fill="#27272a">30%</text><rect x="210" y="81" width="241.8" height="12" fill="#dc2626"/><text x="455.8" y="91" font-size="11" fill="#27272a">62%</text><text x="202" y="114" text-anchor="end" font-size="12" fill="#27272a">College-educated white voters</text><rect x="210" y="98" width="70.2" height="12" fill="#2563eb"/><text x="284.2" y="108" font-size="11" fill="#27272a">18%</text><rect x="210" y="111" width="280.8" height="12" fill="#dc2626"/><text x="494.8" y="121" font-size="11" fill="#27272a">72%</text><text x="202" y="144" text-anchor="end" font-size="12" fill="#27272a">Black voters</text><rect x="210" y="128" width="46.8" height="12" fill="#2563eb"/><text x="260.8" y="138" font-size="11" fill="#27272a">12%</text><rect x="210" y="141" width="234" height="12" fill="#dc2626"/><text x="448" y="151" font-size="11" fill="#27272a">60%</text><text x="202" y="174" text-anchor="end" font-size="12" fill="#27272a">Hispanic &amp; Latino voters</text><rect x="210" y="158" width="42.9" height="12" fill="#2563eb"/><text x="256.9" y="168" font-size="11" fill="#27272a">11%</text><rect x="210" y="171" width="202.8" height="12" fill="#dc2626"/><text x="416.8" y="181" font-size="11" fill="#27272a">52%</text><text x="202" y="204" text-anchor="end" font-size="12" fill="#27272a">Seniors (65+)</text><rect x="210" y="188" width="39" height="12" fill="#2563eb"/><text x="253" y="198" font-size="11" fill="#27272a">10%</text><rect x="210" y="201" width="292.5" height="12" fill="#dc2626"/><text x="506.5" y="211" font-size="11" fill="#27272a">75%</text><text x="202" y="234" text-anchor="end" font-size="12" fill="#27272a">Suburban women</text><rect x="210" y="218" width="35.1" height="12" fill="#2563eb"/><text x="249.1" y="228" font-size="11" fill="#27272a">9%</text><rect x="210" y="231" width="273" height="12" fill="#dc2626"/><text x="487" y="241" font-size="11" fill="#27272a">70%</text><text x="202" y="264" text-anchor="end" font-size="12" fill="#27272a">Asian American &amp; other voters</text><rect x="210" y="248" width="19.5" height="12" fill="#2563eb"/><text x="233.5" y="258" font-size="11" fill="#27272a">5%</text><rect x="210" y="261" width="226.2" height="12" fill="#dc2626"/><text x="440.2" y="271" font-size="11" fill="#27272a">58%</text><text x="202" y="294" text-anchor="end" font-size="12" fill="#27272a">Young voters (18-29)</text><rect x="210" y="278" width="19.5" height="12" fill="#2563eb"/><text x="233.5" y="288" font-size="11" fill="#27272a">5%</text><rect x="210" y="291" width="179.4" height="12" fill="#dc2626"/><text x="393.4" y="301" font-size="11" fill="#27272a">46%</text><rect x="210" y="36" width="12" height="12" fill="#2563eb"/><text x="228" y="47" font-size="12" fill="#27272a">Share of the national electorate</text><rect x="475" y="36" width="12" height="12" fill="#dc2626"/><text x="493" y="47" font-size="12" fill="#27272a">Base turnout</text><text x="405" y="346" text-anchor="middle" font-size="13" fill="#27272a">Percent</text>
</svg>

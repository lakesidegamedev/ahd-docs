<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="A week at a glance">
<title>A week at a glance</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="339" fill="#ffffff" stroke="#d4d4d8"/>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#27272a">A week at a glance</text>
<rect x="60" y="60" width="180" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="150" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">1  Read</text><text x="150" y="102" text-anchor="middle" font-size="11" fill="#52525b">Map, EV bar, trends</text><rect x="400" y="60" width="180" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="490" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">2  Plan</text><text x="490" y="102" text-anchor="middle" font-size="11" fill="#52525b">Up to 3 actions a day</text><rect x="400" y="180" width="180" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="490" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">3  End the turn</text><text x="490" y="222" text-anchor="middle" font-size="11" fill="#52525b">Opponent acts, events land</text><rect x="60" y="180" width="180" height="60" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="150" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">4  Review</text><text x="150" y="222" text-anchor="middle" font-size="11" fill="#52525b">Week in review</text><line x1="240" y1="90" x2="400" y2="90" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="490" y1="120" x2="490" y2="180" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="400" y1="210" x2="240" y2="210" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="150" y1="180" x2="150" y2="120" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="320" y="152" text-anchor="middle" font-size="12" fill="#52525b">Repeat for 9 weeks</text><rect x="60" y="276" width="230" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="175" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Count and score (0 to 1000)</text><line x1="150" y1="240" x2="150" y2="276" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="162" y="262" font-size="11" fill="#52525b">After the last week</text>
</svg>

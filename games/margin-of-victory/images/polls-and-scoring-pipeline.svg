<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="From your actions to your score">
<title>From your actions to your score</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="269" fill="#ffffff" stroke="#d4d4d8"/>
<text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#27272a">From your actions to your score</text>
<rect x="10" y="120" width="108" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="64" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Actions</text><text x="64" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">and events</text><line x1="118" y1="155" x2="136" y2="155" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="136" y="120" width="108" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="190" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Bloc lean and</text><text x="190" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">enthusiasm</text><line x1="244" y1="155" x2="262" y2="155" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="262" y="120" width="108" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="316" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">State share</text><line x1="370" y1="155" x2="388" y2="155" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="388" y="120" width="108" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="442" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Electoral votes</text><text x="442" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">(tossup band)</text><line x1="496" y1="155" x2="514" y2="155" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="514" y="120" width="108" height="70" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="568" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#27272a">Score</text><line x1="316" y1="226" x2="316" y2="196" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="316" y="244" text-anchor="middle" font-size="12" fill="#52525b">Polls show a blurred view of this step</text>
